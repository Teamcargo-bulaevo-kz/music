name: Build

on:
  push:
    branches: [ main, claude/music-flame-ui ]
  workflow_dispatch:
    inputs:
      release_bundle:
        description: 'Собрать релизный пакет (.aab) для Google Play'
        type: boolean
        default: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Run unit tests
        id: tests
        continue-on-error: true
        shell: bash
        run: |
          gradle testDebugUnitTest --console=plain 2>&1 | tee gradle-test.log
          exit ${PIPESTATUS[0]}

      - name: Report test problems
        if: steps.tests.outcome == 'failure'
        shell: bash
        run: |
          msg=$(grep -E "^e: |FAILED|Assertion|expected|Exception|error:|What went wrong" -A2 gradle-test.log | grep -v "^--" | head -80 | cut -c1-400 | sed 's/%/%25/g' | sed ':a;N;$!ba;s/\n/%0A/g') || true
          fails=$(grep -h "<failure" app/build/test-results/testDebugUnitTest/*.xml 2>/dev/null | cut -c1-500 | sed 's/%/%25/g' | sed ':a;N;$!ba;s/\n/%0A/g') || true
          echo "::error title=Unit tests failed::$msg%0A%0A$fails"
          exit 1

      - name: Build debug APK
        env:
          MUSIC_INTELLIGENCE_URL: ${{ secrets.MUSIC_INTELLIGENCE_URL }}
          MUSIC_INTELLIGENCE_TOKEN: ${{ secrets.MUSIC_INTELLIGENCE_TOKEN }}
        shell: bash
        run: |
          gradle assembleDebug --stacktrace 2>&1 | tee gradle-build.log
          exit ${PIPESTATUS[0]}

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: music-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk

      - name: Build signed release bundle
        if: github.event_name == 'workflow_dispatch' && inputs.release_bundle
        env:
          MUSIC_INTELLIGENCE_URL: ${{ secrets.MUSIC_INTELLIGENCE_URL }}
          MUSIC_INTELLIGENCE_TOKEN: ${{ secrets.MUSIC_INTELLIGENCE_TOKEN }}
          RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        shell: bash
        run: |
          echo "$RELEASE_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          export RELEASE_STORE_FILE="$RUNNER_TEMP/release.jks"
          gradle bundleRelease --stacktrace
          cp app/build/outputs/bundle/release/app-release.aab music-release.aab

      - name: Upload release bundle
        if: github.event_name == 'workflow_dispatch' && inputs.release_bundle
        uses: actions/upload-artifact@v4
        with:
          name: music-release-aab
          path: music-release.aab
